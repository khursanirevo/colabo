name: publish
# Publishes to PyPI via trusted publishing (OIDC, no API token stored anywhere).
# One-time setup on PyPI (account khursani8): Account settings -> Publishing -> Add pending publisher:
#   PyPI project: colabo | Owner: khursanirevo | Repository: colabo | Workflow: publish.yml | Environment: pypi
# Release: bump `version` in pyproject.toml, commit, then `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
